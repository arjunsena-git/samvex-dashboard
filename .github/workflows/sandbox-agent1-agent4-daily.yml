name: Sandbox — Agent 1 + 4 (Daily Analysis)

on:
  schedule:
    # 4:30 PM IST = 11:00 UTC, Monday–Friday
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  sandbox-daily:
    name: Signal outcomes + auto-tune (sandbox branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout sandbox branch
        uses: actions/checkout@v4
        with:
          ref: sandbox
          token: ${{ secrets.SAMVEX_GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --upgrade pip pytz requests yfinance pandas

      - name: Configure git
        run: |
          git config user.name  "Samvex AI"
          git config user.email "ai@samvex.in"
          git remote set-url origin https://x-access-token:${{ secrets.SAMVEX_GH_PAT }}@github.com/arjunsena-git/samvex-dashboard.git

      - name: Run daily analysis (agents 1 + 4)
        run: python scripts/daily_analysis.py
