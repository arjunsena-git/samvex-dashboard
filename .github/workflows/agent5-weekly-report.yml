name: Agent 5 — Weekly Report Generator

on:
  schedule:
    # Saturday 8:00 AM IST = Friday 02:30 UTC
    - cron: '30 2 * * 6'
  workflow_dispatch:

jobs:
  weekly-report:
    name: Generate weekly performance report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sandbox branch
        uses: actions/checkout@v4
        with:
          ref: sandbox
          token: ${{ secrets.SAMVEX_GH_PAT }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --upgrade pip pytz requests

      - name: Run weekly report
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: python scripts/agent5_weekly_report.py
